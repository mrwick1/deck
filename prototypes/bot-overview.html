<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck · Overview experiments</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px/1.5 var(--font-sans,system-ui)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button{color:inherit;border:1px solid var(--border);background:var(--secondary);border-radius:8px;padding:8px 12px}button:hover{filter:brightness(1.15)}button.active,.primary{background:var(--primary);color:var(--primary-foreground)}.muted{color:var(--muted-foreground)}.small{font-size:12px}.top,.toolbar,.row,.heading,.actions{display:flex;align-items:center;gap:10px}.top{justify-content:space-between;margin:10px 0 20px}.brand{font-size:21px;letter-spacing:-1px;font-weight:750}.brand span{color:var(--muted-foreground);font-weight:400;letter-spacing:0;font-size:12px;margin-left:12px}.lab{font:11px var(--font-mono,monospace);text-transform:uppercase;letter-spacing:1px;color:var(--muted-foreground)}.toolbar{flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}.toolbar button{font-size:12px}.toolbar label{margin-left:auto}.toolbar select{background:var(--card);color:inherit;border:1px solid var(--border);padding:7px;border-radius:7px}h1{font-size:25px;letter-spacing:-.8px;margin:0}h2{font-size:15px;margin:0}h3{font-size:14px;margin:0}.heading{justify-content:space-between;margin-bottom:20px}.stats{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--success)}.wait{background:var(--warning)}.off{background:var(--muted-foreground)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius,12px);padding:16px}.card{display:flex;flex-direction:column;gap:13px}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--secondary);color:var(--primary);font-weight:700;flex-shrink:0}.row .grow{flex:1;min-width:0}.badge{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-foreground)}.activity{min-height:48px}.activity strong{display:block;font-weight:550}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-foreground)}.attention{border-left:2px solid var(--warning);padding-left:9px;font-size:12px;color:var(--warning)}.card .actions{margin-top:auto}.actions button{font-size:12px}.text-btn{border:0;background:transparent;color:var(--primary);padding:5px 0}.feed{display:flex;flex-direction:column;gap:0}.entry{display:flex;gap:12px;padding:17px 0;border-bottom:1px solid var(--border)}.entry:first-child{padding-top:0}.entry:last-child{border:0;padding-bottom:0}.time{font:11px var(--font-mono,monospace);color:var(--muted-foreground);white-space:nowrap}.entry p{margin:4px 0}.split{display:grid;grid-template-columns:220px 1fr;gap:14px}.roster{display:flex;flex-direction:column;gap:8px}.roster button{text-align:left;padding:12px;background:var(--card)}.roster button.active{border-color:var(--primary);color:var(--foreground);background:var(--secondary)}.roster small{display:block;color:var(--muted-foreground);margin-top:4px}.section-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted-foreground);margin:22px 0 12px}.note{font-size:12px;color:var(--muted-foreground);margin:18px 0 8px}.back{margin-bottom:18px}.chat-header{display:flex;gap:12px;align-items:center}.chat-header .grow{flex:1}.chat-body{padding:24px 0;min-height:180px}.bubble{background:var(--secondary);padding:12px 15px;border-radius:12px;margin:12px 0 12px auto;max-width:85%}.reply{margin:12px 0;max-width:95%}.work{border-left:2px solid var(--primary);padding:5px 0 5px 14px;margin:18px 0}.work div{margin:6px 0}.composer{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card)}.composer input{width:100%;border:0;outline:0;background:transparent;color:inherit;padding:4px 0 14px}.composer .row{justify-content:space-between;flex-wrap:wrap}.composer select{background:var(--secondary);color:inherit;border:1px solid var(--border);padding:6px;border-radius:6px}.screen{border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}.screen-bar{padding:8px 12px;background:var(--secondary);font-size:11px}.screen-body{padding:16px;background:var(--card)}.screen-body .listing{padding:10px 0;border-bottom:1px solid var(--border)}.toast{position:sticky;bottom:8px;padding:10px 14px;border:1px solid var(--primary);border-radius:8px;background:var(--popover);color:var(--popover-foreground);margin-top:12px}.inbox-item{padding:14px 0;border-bottom:1px solid var(--border)}.inbox-item p{margin:6px 0 12px}.empty{padding:30px 0;color:var(--muted-foreground)}@media(max-width:540px){.cards,.split{grid-template-columns:1fr}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar label{margin-left:0}.brand span{display:none}.heading{align-items:flex-start}.top{margin-bottom:14px}.chat-header{flex-wrap:wrap}.stats{gap:10px}.time{font-size:10px}}

/* Selected overview direction: quiet surfaces, expressive bot presence. */
.cards{gap:12px 28px}.card{background:transparent;border:0;border-top:1px solid var(--border);border-radius:0;padding:23px 5px 19px;gap:15px;position:relative}.card h2{font-size:18px;letter-spacing:-.4px}.card .row{gap:14px}.card .avatar{width:48px;height:48px;background:var(--secondary);border-radius:17px;color:var(--info);position:relative}.card.bot-mail .avatar{color:var(--success)}.card.bot-social .avatar{color:var(--warning)}.card.bot-research .avatar{color:var(--muted-foreground)}.eyes{display:flex;gap:9px;position:absolute;top:17px;left:13px}.eyes i{display:block;width:6px;height:8px;background:currentColor;border-radius:4px}.mouth{position:absolute;top:31px;left:21px;width:7px;height:2px;background:currentColor;border-radius:2px}.working:not(.automation-paused) .eyes{animation:look 5s infinite}.asleep .eyes i{height:2px;margin-top:4px}.asleep .mouth{width:4px;height:4px;border-radius:50%}.waiting .avatar{box-shadow:0 0 0 1px var(--warning)}.card .badge{letter-spacing:.7px;font-size:10px}.card .activity{position:relative;padding-left:18px;min-height:68px}.activity-signal{position:absolute;left:0;top:5px;width:8px;display:flex;flex-direction:column;gap:3px}.activity-signal i{height:2px;background:var(--border);width:6px;border-radius:2px}.working:not(.automation-paused) .activity-signal i{background:var(--success);animation:signal 1.6s infinite}.activity-signal i:nth-child(2){animation-delay:.2s!important}.activity-signal i:nth-child(3){animation-delay:.4s!important}.activity-signal i:nth-child(4){animation-delay:.6s!important}.activity-signal i:nth-child(5){animation-delay:.8s!important}.card .activity strong{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:5px}.card .attention{border:0;color:var(--warning);padding:0;font-size:12px}.card .attention:before{content:'↗';margin-right:8px}.card .actions button{background:transparent;border:0;padding:5px 0;color:var(--muted-foreground)}.card .actions button.primary{color:var(--foreground)}.card .actions{gap:20px}.card .actions button:hover{color:var(--primary)}.card .meta{font-size:11px}.card.asleep .activity{color:var(--muted-foreground)}@keyframes look{0%,35%,75%,100%{transform:translateX(0)}45%,65%{transform:translateX(3px)}}@keyframes signal{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="brand">deck<span>Your bots, at work.</span></div><span class="lab">Interactive prototype · sample data</span></header>
<nav class="toolbar" aria-label="Prototype layout"><button data-layout="cards">01 · Bot overview</button><button data-layout="feed">02 · Activity feed</button><button data-layout="split">03 · Split overview</button><label class="small muted">Show <select id="filter" aria-label="Filter bots"><option value="all">All bots</option><option value="attention">Needs attention</option><option value="working">Working</option></select></label></nav>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const bots=[
{id:'jobs',name:'Job hunter',initial:'J',purpose:'LinkedIn · Roles that fit you',state:'working',status:'Working',task:'Comparing 8 new openings',detail:'Reading role requirements and checking your preferences.',queue:2,attention:'2 applications ready for your review',screen:true},
{id:'mail',name:'Comms',initial:'C',purpose:'Gmail · Keep your inbox clear',state:'working',status:'Working',task:'Preparing your morning brief',detail:'Grouping 12 unread emails by importance.',queue:1,attention:'',screen:false},
{id:'social',name:'Social',initial:'S',purpose:'Instagram + Facebook',state:'waiting',status:'Waiting for you',task:'Reply draft ready',detail:'Waiting for approval before posting a reply.',queue:3,attention:'Approve a reply',screen:false},
{id:'research',name:'Research',initial:'R',purpose:'Web research · On demand',state:'asleep',status:'Asleep',task:'All caught up',detail:'Computer saved. Ready to wake for its next task.',queue:0,attention:'',screen:false}
];
let layout='cards',view='home',selected='jobs',filter='all';
const messages=Object.fromEntries(bots.map(b=>[b.id,[]]));
const events=[{id:'jobs',time:'Now',text:'Reading requirements for a product engineering role.',tool:'Browser · Read page'}, {id:'mail',time:'1 min',text:'Found 3 emails that need a response. Building your brief.',tool:'Gmail API · Read messages'},{id:'social',time:'4 min',text:'Drafted a reply. Waiting for your approval.',tool:'Approval requested'},{id:'jobs',time:'8 min',text:'Shortlisted 2 roles that match your preferences.',tool:'Saved result'},{id:'research',time:'18 min',text:'Finished the comparison and saved its computer.',tool:'Task completed · Computer asleep'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dot(b){return `<span class="dot ${b.state==='waiting'?'wait':b.state==='working'?'':'off'}"></span>`}
function visibleBots(){return bots.filter(b=>filter==='all'||filter==='attention'&&b.attention||filter==='working'&&b.state==='working')}
function notify(t){document.getElementById('toast').className='toast';document.getElementById('toast').textContent=t;}
function card(b){return `<article class="card bot-${b.id} ${b.state} ${b.automationPaused?'automation-paused':''}"><div class="row"><div class="avatar bot-face" aria-hidden="true"><span class="eyes"><i></i><i></i></span><span class="mouth"></span></div><div class="grow"><h2>${b.name}</h2><div class="small muted">${b.purpose}</div></div></div><div><span class="badge">${dot(b)}${b.status}${b.automationPaused?' · Automation paused':''}</span></div><div class="activity"><span class="activity-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><strong>${esc(b.task)}</strong><span class="small muted">${esc(b.detail)}</span></div>${b.attention?`<div class="attention">${esc(b.attention)}</div>`:''}<div class="meta"><span>${b.queue} queued</span><span>${b.screen?'Browsing now':'Computer '+(b.state==='asleep'?'asleep':'ready')}</span></div><div class="actions"><button class="primary" data-open="${b.id}">Open chat ↗</button>${b.attention?`<button data-review="${b.id}">Review</button>`:''}</div></article>`}
function feed(items){return `<div class="feed">${items.map(e=>{const b=bots.find(b=>b.id===e.id);return `<article class="entry"><div class="avatar">${b.initial}</div><div class="grow"><button class="text-btn" data-open="${b.id}">${b.name} ↗</button><p>${e.text}</p><span class="small muted">${e.tool}</span></div><span class="time">${e.time}</span></article>`}).join('')}</div>`}
function home(){const shown=visibleBots();return `<div class="heading"><div><h1>Your bots, at work.</h1><div class="stats small muted"><span>${bots.filter(b=>b.state==='working').length} working</span><span>${bots.filter(b=>b.attention).length} need attention</span><span>${bots.reduce((s,b)=>s+b.queue,0)} tasks queued</span></div></div><button data-inbox>Inbox · ${bots.filter(b=>b.attention).length}</button></div>${layout==='cards'?`<div class="cards">${shown.map(card).join('')}</div>`:layout==='feed'?`<div class="panel">${feed(events.filter(e=>shown.some(b=>b.id===e.id)))}</div>`:`<div class="split"><div class="roster">${shown.map(b=>`<button class="${selected===b.id?'active':''}" data-select="${b.id}">${dot(b)}${b.name}<small>${b.status} · ${b.queue} queued</small></button>`).join('')}</div><div class="panel">${shown.some(b=>b.id===selected)?`${card(bots.find(b=>b.id===selected))}<div class="section-label">Recent activity</div>${feed(events.filter(e=>e.id===selected))}`:'<div class="empty">Select a bot to see its work.</div>'}</div></div>`}${!shown.length?'<div class="empty">No bots match this filter.</div>':''}<p class="note">Selected direction: bot overview. Motion reflects sample state; open a bot to try its controls.</p>`}
function chat(){const b=bots.find(b=>b.id===selected);return `<button class="back" data-home>← All bots</button><div class="chat-header"><div class="avatar">${b.initial}</div><div class="grow"><h1>${b.name}</h1><span class="small muted">${dot(b)}${b.status} · ${b.automationPaused?'Automation paused · ':''}${b.queue} queued</span></div><button data-pause>${b.automationPaused?'Resume automation':'Pause automation'}</button><button data-sleep>${b.state==='asleep'?'Wake computer':'Sleep computer'}</button></div><div class="chat-body"><div class="reply">${b.id==='jobs'?'I’m comparing today’s openings against your preferred roles. Two applications are ready for review.':esc(b.detail)}</div><div class="work"><span class="small muted">CURRENT ACTIVITY</span><div><strong>${esc(b.task)}</strong></div><div class="small muted">${b.id==='jobs'?'✓ Searched for matching roles<br>✓ Filtered by your preferences<br>→ Reading requirements for opening 3 of 8':esc(b.detail)}</div></div>${b.screen?`<div class="screen"><div class="screen-bar">Computer view · Browser active · illustrative sample</div><div class="screen-body"><span class="small muted">Role search / Results</span><div class="listing"><strong>Product engineer</strong><br><span class="small muted">Remote · Matches your preferred role</span></div><div class="listing"><strong>Senior frontend engineer</strong><br><span class="small muted">Hybrid · Checking location requirements</span></div></div></div>`:''}${messages[b.id].map(m=>`<div class="bubble">${esc(m.text)}<div class="small muted">${esc(m.mode)}</div></div>`).join('')}${b.attention?`<div class="attention">${esc(b.attention)} <button data-review="${b.id}">Review request</button></div>`:''}</div><form class="composer" id="compose"><input id="message" aria-label="Message your bot" placeholder="Steer this task, or leave a message for later…" required maxlength="2000"><div class="row"><div class="row"><select id="mode" aria-label="Message delivery"><option value="steer">Steer current task</option><option value="queue">Queue after this task</option></select><select id="priority" aria-label="Queued message priority" hidden><option value="normal">Normal priority</option><option value="high">Before background work</option></select></div><div class="row"><button type="button" data-stop>Stop action</button><button class="primary" type="submit">Send ↗</button></div></div></form><p class="note">Prototype only. Controls change sample state; no account or computer is connected.</p>`}
function inbox(){return `<button class="back" data-home>← All bots</button><h1>Needs your attention</h1><p class="muted">Requests stay here until you resolve them.</p><div class="panel">${bots.filter(b=>b.attention).map(b=>`<article class="inbox-item"><div class="small muted">${b.name}</div><h2>${esc(b.attention)}</h2><p>${b.id==='jobs'?'Review the shortlisted roles and application details before submitting.':'Draft reply: “Thanks for reaching out. I’ll send the details shortly.”'}</p><div class="actions"><button data-open="${b.id}">Open bot</button><button data-approve="${b.id}" class="primary">Approve once</button><button data-dismiss="${b.id}">Decline</button></div></article>`).join('')||'<div class="empty">You’re all caught up.</div>'}</div><p class="note">Sample approvals only. Nothing is sent or submitted.</p>`}
function render(){document.querySelectorAll('[data-layout]').forEach(el=>{el.classList.toggle('active',el.dataset.layout===layout);el.setAttribute('aria-pressed',el.dataset.layout===layout)});document.getElementById('filter').disabled=view!=='home';document.getElementById('app').innerHTML=view==='home'?home():view==='inbox'?inbox():chat();}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const b=bots.find(b=>b.id===selected);if(el.dataset.layout){layout=el.dataset.layout;view='home'}else if(el.dataset.open){selected=el.dataset.open;view='chat'}else if(el.dataset.select){selected=el.dataset.select}else if(el.hasAttribute('data-home')){view='home'}else if(el.hasAttribute('data-inbox')||el.dataset.review){view='inbox'}else if(el.dataset.approve||el.dataset.dismiss){const target=bots.find(b=>b.id===(el.dataset.approve||el.dataset.dismiss));target.attention='';if(target.state==='waiting'){target.state='idle';target.status='Idle';target.task='Request resolved';target.detail='Ready for the next task.'}notify(el.dataset.approve?'Approved in sample state. No external action was performed.':'Request declined in sample state.')}else if(el.hasAttribute('data-stop')){b.state='idle';b.status='Stopped';b.task='Current action stopped';b.detail='Queued tasks remain available.';b.screen=false;notify('Stopped in sample state. Submitted external actions cannot be undone.')}else if(el.hasAttribute('data-pause')){const resume=!!b.automationPaused;b.automationPaused=!resume;notify(resume?'Automation resumed.':'Automation paused. Incoming events will queue.')}else if(el.hasAttribute('data-sleep')){const wake=b.state==='asleep';b.state=wake?'idle':'asleep';b.status=wake?'Idle':'Asleep';b.task=wake?'Computer ready':'Computer saved';b.detail=wake?'Ready for its next task.':b.automationPaused?'Automation paused. Waiting for your instruction.':'Automation can wake the computer when enabled.';b.screen=false;notify(wake?'Computer woke in sample state.':'Computer saved and stopped in sample state.')}else return;render()});
document.getElementById('filter').addEventListener('change',e=>{filter=e.target.value;if(!visibleBots().some(b=>b.id===selected)&&visibleBots().length)selected=visibleBots()[0].id;render()});
document.addEventListener('change',e=>{if(e.target.id==='mode')document.getElementById('priority').hidden=e.target.value!=='queue'});
document.addEventListener('submit',e=>{if(e.target.id!=='compose')return;e.preventDefault();const input=document.getElementById('message'),text=input.value.trim();if(!text)return;const mode=document.getElementById('mode').value;const b=bots.find(b=>b.id===selected);messages[b.id].push({text,mode:mode==='steer'?'Guidance for current work':'Queued · '+document.getElementById('priority').selectedOptions[0].textContent});if(mode==='queue')b.queue++;notify(mode==='queue'?'Message queued after the current task.':'Guidance sent to the current task.');render()});
render();
</script>
</body></html>
