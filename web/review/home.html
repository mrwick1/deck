<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><title>Deck Home fixture</title></head><body><div id="root"></div>
<script>
// Development-only fixture. All API traffic stays in memory. No real backend is used.
const mode = new URLSearchParams(location.search).get('mode') || 'empty';
const draft = {revision:1,name:'Morning mail',instructions:'Summarize the inbox each morning',model:'fixture',authority:'Full',resources:{cpus:2,memory_mib:1024,disk_gib:8},budget:{currency:'USD',exponent:2,period:'fixture',allowance:0,ceiling:0},credentials:[],task:null};
const row = {version:1,chat_id:1,phase:'Draft',runtime_ready:false,error:null,checklist:[],setup:{id:'fixture-bot',draft,max_attempts:3,wait:null,steps:[]}};
const ready = {...row,phase:'Ready',runtime_ready:true,setup:{...row.setup,draft:{...draft,name:'Morning mail and project updates with a deliberately long bot name'}}};
const status = {bot_id:'fixture-bot',chat_id:1,computer:'saved',automation_paused:false,budget_hold:true,budget_reason:'Fixture hold',working:null,waiting:null,queued:0,tasks:[{id:'result-one',title:'A deliberately long completed result title with project decisions and next steps',state:'done',priority:1,detail:null,source:'owner'}],unresolved:0,idle_secs:0,idle_left_ms:null,pending_events:0,last_error:null,screen:{viewers:0,worker:false,captures:0,delivered:0,unchanged:0}};
// Setup progress modes: setup-phone, setup-secret, setup-unsupported, setup-investigate, setup-exhausted, setup-preparing. The route is #setup/fixture-bot.
const progress = m => { const wait = m==='setup-phone' ? {request_id:'req-1',kind:'PhoneApproval',expires_at:null,instructions:'Approve the sign-in on your phone.',match_number:'42'} : m==='setup-secret' ? {request_id:'req-1',kind:{Credential:{label:'Fixture login'}},expires_at:null} : m==='setup-unsupported' ? {request_id:'req-1',kind:{Unsupported:{reason:'fixture'}},expires_at:null} : null;
  const phase = wait ? 'Waiting' : m==='setup-investigate' ? 'Investigate' : m==='setup-exhausted' ? 'Exhausted' : 'Ready';
  const steps = m==='setup-investigate' ? [{step:'Allocate',status:'Done',last_error:null},{step:{Credential:'Mail'},status:'Unknown',last_error:'The service did not confirm <b>the</b> step'}] : [];
  return {...row,version:5,phase,error:m==='setup-exhausted'?'Step failed after 3 attempts':null,checklist:[{label:'Computer created',done:true},{label:'Sign in',done:false}],setup:{...row.setup,wait,steps}}; };
window.__homeFixture = {calls:[], hits:{}, control:[], rows:mode==='populated'?[row]:mode==='ready'||mode==='chat'?[ready]:mode.startsWith('setup-')?[progress(mode)]:[], holdAct:false, releaseAct(){this.actGate?.();this.actGate=null;}, actFail:false, revise(){const c=this.rows[0];this.rows[0]={...c,version:c.version+1};}, fail:mode==='failure', pending:null, created:false, loading:mode==='loading', loads:[], releaseLoad(){this.loading=false;this.loads.splice(0).forEach(resolve=>resolve());}, release(){this.pending?.();this.pending=null;}, hold:false, write:null, releaseWrite(){this.writeGate?.();this.writeGate=null;}, bump(patch){const c=this.rows[0];this.rows[0]={...c,version:c.version+1,setup:{...c.setup,draft:{...c.setup.draft,...patch,revision:c.setup.draft.revision+1}}};}};
// Chat fixture (mode=chat). In-memory only. Strict: an unknown chat is a 404. Modes are set from the page:
// create: ok|hold|lost (answer lost, chat exists)|lost-unapplied|refuse. send: ok|hold|refuse|lost (stored, answer lost)|lost-unapplied.
// history: ok|fail. release() frees held calls. emit(chatId,kind,data) pushes a stream event. posts/gets/es/cancels record the traffic.
const mk=(id,role,t,k)=>({id:k,chat_id:id,role,content:JSON.stringify({role,content:t}),created_at:''});
const chat=window.__chatFake={posts:[],gets:[],es:[],cancels:[],create:'ok',send:'ok',history:'ok',gates:[],nextId:7,msgs:{3:Array.from({length:30},(_,k)=>mk(3,k%2?'assistant':'user','Synthetic message '+k+' with enough words to wrap across lines in a narrow phone viewport.',k))},list:mode==='chat'?[{id:3,title:'Earlier conversation',created_at:'',bot_id:null}]:[],
  release(){this.gates.splice(0).forEach(resolve=>resolve());}, emit(id,kind,data,eid){this.es.filter(e=>e.id===id&&!e.closed).forEach(e=>(e.l[kind]||[]).forEach(f=>f({data:JSON.stringify(data),lastEventId:String(eid)})));}};
const chatRoute = async (path, init) => {
  const method=init.method||'GET', hold=()=>new Promise(resolve=>chat.gates.push(resolve));
  if(path==='/api/chats'){ if(method!=='POST') return Response.json(chat.list);
    chat.posts.push(path); if(chat.create==='hold') await hold();
    if(chat.create==='refuse') return Response.json({error:'The title was refused'},{status:400});
    if(chat.create==='lost-unapplied') return Response.json({error:'The connection ended'},{status:503});
    const id=chat.nextId++; chat.msgs[id]=[]; chat.list.unshift({id,title:JSON.parse(init.body).title,created_at:'',bot_id:null});
    return chat.create==='lost' ? Response.json({error:'The connection ended'},{status:503}) : Response.json(chat.list[0]); }
  const m=path.match(/^\/api\/chats\/(\d+)\/messages$/);
  if(m && chat.msgs[m[1]]){ const id=+m[1];
    if(method==='GET'){ chat.gets.push(path); return chat.history==='fail' ? Response.json({error:'History is unavailable'},{status:503}) : Response.json(chat.msgs[id]); }
    chat.posts.push(path); if(chat.send==='hold') await hold();
    if(chat.send==='refuse') return Response.json({error:'The message was refused'},{status:400});
    if(chat.send==='lost-unapplied') return Response.json({error:'The connection ended'},{status:503});
    chat.msgs[id].push(mk(id,'user',JSON.parse(init.body).text,1000+chat.msgs[id].length));
    return chat.send==='lost' ? Response.json({error:'The connection ended'},{status:503}) : Response.json({run_id:100+chat.posts.length,kind:'started'}); }
  const c=path.match(/^\/api\/runs\/(\d+)\/cancel$/); if(c){ chat.cancels.push(+c[1]); return new Response(null,{status:204}); }
  return null;
};
window.fetch = async (input, init={}) => {
  const path = typeof input==='string'?input:input.url;
  const state = window.__homeFixture;
  state.calls.push({path,method:init.method||'GET',body:/\/secret$/.test(path)?'[redacted]':init.body});
  if(path==='/api/setups' && init.method==='POST'){
    await new Promise(resolve=>{state.pending=resolve;});
    if(mode==='create-reject') return Response.json({error:'Please revise the job description'},{status:400});
    state.created=true;state.rows=[{...row,setup:{...row.setup,draft:{...draft,instructions:JSON.parse(init.body).job}}}];
    if(mode==='refresh-failure') state.fail=true;
    if(mode==='lost-reply') return Response.json({error:'The connection ended before confirmation'},{status:503});
    return Response.json(state.rows[0]);
  }
  // Setup review writes. state.hold pauses a write. state.write is 'reject', 'reject-approve', 'lost' (applied, reply lost) or 'lost-unapplied'. bump(patch) acts as another client.
  const write=path.match(/^\/api\/setups\/fixture-bot(\/approve)?$/);
  if(write && init.method==='POST'){
    const body=JSON.parse(init.body), approve=!!write[1];
    if(state.hold) await new Promise(resolve=>state.writeGate=resolve);
    const current=state.rows[0];
    if(state.write==='reject'||(approve&&state.write==='reject-approve')) return Response.json({error:approve?'resources exceed the configured limits':'This fixture rejects the draft'},{status:400});
    if(state.write==='lost-unapplied') return Response.json({error:'The connection ended before confirmation'},{status:503});
    if(body.version!==current.version||(approve&&body.revision!==current.setup.draft.revision)) return Response.json({error:'The setup changed'},{status:409});
    state.rows[0]=approve?{...current,version:current.version+1,phase:'Provisioning'}:{...current,version:current.version+1,setup:{...current.setup,draft:{...body.draft,revision:current.setup.draft.revision+1}}};
    if(state.write==='lost') return Response.json({error:'The connection ended before confirmation'},{status:503});
    return new Response(null,{status:204});
  }
  // Setup progress actions. Strict: the version and request id must be current, else 409. Pause and Resume change no row, as on the server. The secret body is never stored.
  const act=path.match(/^\/api\/setups\/fixture-bot\/(control|challenge\/respond|secret)$/);
  if(act && init.method==='POST'){
    const body=JSON.parse(init.body); state.hits[act[1]]=(state.hits[act[1]]||0)+1;
    if(state.holdAct) await new Promise(resolve=>state.actGate=resolve);
    if(state.actFail) return Response.json({error:'Fixture action failed'},{status:500});
    const c=state.rows[0], w=c.setup.wait;
    if(body.version!==c.version||(act[1]!=='control'&&(!w||body.request_id!==w.request_id))) return Response.json({error:'The setup changed'},{status:409});
    if(act[1]==='control'){ if(body.command.action==='attempts') state.rows[0]={...c,version:c.version+1,phase:'Provisioning',setup:{...c.setup,max_attempts:body.command.value}}; else state.control.push(body.command); }
    else if(act[1]==='secret') state.rows[0]={...c,version:c.version+1,phase:'Provisioning',setup:{...c.setup,wait:null}};
    else if(body.decision==='cancel') state.rows[0]={...c,version:c.version+1,setup:{...c.setup,wait:{...w,request_id:'req-2'}}};
    else state.rows[0]={...c,version:c.version+1,setup:{...c.setup,wait:{...w,answered:true}}};
    return new Response(null,{status:204});
  }
  const chatReply = await chatRoute(path, init); if(chatReply) return chatReply;
  if(state.loading) await new Promise(resolve=>state.loads.push(resolve));
  if(mode==='unauthorized') return Response.json({error:'Sign in required'},{status:401});
  if(state.fail) return Response.json({error:'Fixture connection failure'},{status:503});
  if(path==='/api/setup-options') return Response.json({enabled:mode!=='disabled',protected_input:mode==='setup-secret'});
  if(path==='/api/setups'){const snapshot=structuredClone(state.rows);if(state.holdRows) await new Promise(resolve=>state.releaseRows=resolve);return Response.json(snapshot);}
  if(path==='/api/bots/fixture-bot') return Response.json(status);
  if(path==='/api/bots/fixture-bot/inbox') return Response.json([]);
  if(path==='/api/bots/fixture-bot/secret-requests') return Response.json([]);
  if(path==='/api/chats/1/messages' && init.method!=='POST') return Response.json([]);
  if(path==='/api/chats/1/messages' && init.method==='POST'){await new Promise(resolve=>state.pending=resolve);return Response.json({kind:'queued',task_id:'fixture-task'});}
  if(path==='/api/bot') return Response.json({error:'No default bot'},{status:404});
  return Response.json({error:'Fixture blocks this endpoint'},{status:404});
};
window.EventSource = class {constructor(url){this.url=url;this.id=+(url.match(/chats\/(\d+)\/events/)||[])[1];this.l={};this.closed=false;chat.es.push(this);setTimeout(()=>this.onopen&&this.onopen(),0);}addEventListener(kind,fn){(this.l[kind]??=[]).push(fn);} removeEventListener(){} close(){this.closed=true;}};
</script><script type="module" src="/src/experience/main.tsx"></script></body></html>
