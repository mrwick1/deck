[package]
name = "deck"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A self-hosted AI agent with a web app"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
async-stream = "0.3.6"
axum = "0.8"
futures-util = "0.3.34"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7.20"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
